
<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>🌼 My To-Do List</h1>
        <p>Organize your day, achieve your goals!</p>
    </header>

    <div class="stats">
        <div class="stat-box">
            <h2 id="totalTasks">0</h2>
            <p>Total Tasks</p>
        </div>

        <div class="stat-box">
            <h2 id="completedTasks">0</h2>
            <p>Completed</p>
        </div>

        <div class="stat-box">
            <h2 id="pendingTasks">0</h2>
            <p>Pending</p>
        </div>
    </div>

    <div class="progress-section">
        <p>Daily Progress</p>
        <div class="progress-bar">
            <div id="progress"></div>
        </div>
        <p id="progressText">0% Completed</p>
    </div>

    <h3>✨ Add a New Task</h3>

    <div class="input-area">
        <input type="text" id="taskInput"
               placeholder="Enter your task...">

        <input type="date" id="dueDate">

        <select id="priority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
        </select>

        <button onclick="addTask()" id="addBtn">Add</button>
    </div>

    <h3>📝 My Tasks</h3>

    <input type="text" id="searchInput"
           placeholder="🔍 Search tasks..."
           oninput="displayTasks()">

    <div class="filters">
        <button onclick="setFilter('all')" class="active">All</button>
        <button onclick="setFilter('active')">Active</button>
        <button onclick="setFilter('completed')">Completed</button>
    </div>

    <ul id="taskList"></ul>

    <p id="emptyMessage">
        No tasks found! Add a new task 🌱
    </p>

    <button class="clear-btn" onclick="clearCompleted()">
        Clear Completed Tasks
    </button>

    <footer>
        💚 Stay Happy • Stay Productive 🌼
    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
